[build-system]
requires = ['setuptools']
build-backend = 'setuptools.build_meta'


[project]
name = "fitic"
version = '2026.99.99'
authors = [
    {name = "Guillaume Monteil", email = "gmonteil@ik.me"},
    {name = 'Michael Vossbeck', email = 'michael.vossbeck@inversion-lab.com'},
    {name = 'Thomas Kaminski', email = 'thomas.kaminski@inversion-lab.com'}]
readme = "README.md"
dependencies = ['numpy', 'ipython', 'pandas', 'xarray', 'h5py', 'netcdf4', 'loguru', 'omegaconf', 'pint', 'tqdm', 'dask', 'bottleneck', 'xxhash']
requires-python = '>=3.10'


[tool.setuptools.packages.find]
#include = ['tm5']
#-- 2026-05-27: otherwise some files are missing when installing with 'pip install .'
#               (reason not yet clear...)
include = ['tm5', 'tm5.gui', 'tm5.gui.widgets']

[project.optional-dependencies]
dev = ['ipython', 'mkdocs']
fitic = ['flask', 'jupyter', 'jupyter_bokeh', 'panel', 'param', 'hvplot', 'geoviews', 'holoviews', 'cartopy',]


[project.scripts]
tm5 = 'tm5.cli:forward'
